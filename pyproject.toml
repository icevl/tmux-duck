[project]
name = "codexbot"
version = "0.1.0"
description = "Telegram Bot for monitoring Codex sessions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot[rate-limiter]>=21.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "libtmux>=0.37.0",
    "Pillow>=10.0.0",
    "aiofiles>=24.0.0",
    # 0.6.x dropped the private symbols we import (`_update_block`,
    # `escape_latex`, `render` submodule) and stopped pulling mistletoe.
    "telegramify-markdown>=0.5.0,<0.6",
    "mistletoe>=1.4",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "itsdangerous>=2.2.0",
    "pyotp>=2.9.0",
    "qrcode>=7.4.0",
    "lancedb>=0.32.0",
    "sentence-transformers>=2.7.0",
    "transformers>=4.51.0",
    "torch>=2.6.0",
    "slack-bolt>=1.18.0",
    "aiohttp>=3.13.5",
]

[tool.uv.sources]
# Linux uses the cu124 wheels for GPU embedding; macOS falls back to the
# default PyPI CPU wheels. No override-dependencies block here, because
# sentence-transformers genuinely needs torch importable wherever the
# search worker runs (including macOS dev boxes with
# CODEXBOT_SEARCH_ENABLED=true).
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[project.scripts]
codexbot = "codexbot.main:main"
codexbot-search-worker = "codexbot.search.worker:main"
codexbot-search-benchmark = "codexbot.search.benchmark:main"

[project.optional-dependencies]
dev = [
    "pyright>=1.1.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codexbot"]

# Target Python 3.12
[tool.black]
target-version = ["py312"]

[tool.ruff]
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests using real filesystem or external processes",
]

[tool.coverage.run]
source = ["codexbot"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "logger\\.",
]
