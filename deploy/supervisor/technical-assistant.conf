; Technical Assistant — codexbot in headless Slack-only mode (no Telegram/web).
; Copy to /etc/supervisor/conf.d/ and adjust paths/user, then:
;   supervisorctl reread && supervisorctl update && supervisorctl start technical-assistant
; Flip autostart to true once the agent CLI (claude/codex) is authenticated
; and a Slack connector is imported (codexbot-connectors import ...).
[program:technical-assistant]
command=/home/wavix/.local/bin/uv run codexbot
directory=/home/wavix/technical-assistant
user=wavix
environment=HOME="/home/wavix",PATH="/home/wavix/.local/bin:/usr/local/bin:/usr/bin:/bin",CODEXBOT_TELEGRAM_ENABLED="false",CODEXBOT_SEARCH_ENABLED="false"
autostart=false
autorestart=true
startsecs=10
stopsignal=TERM
stopwaitsecs=20
stdout_logfile=/home/wavix/.codexbot/logs/supervisor.out.log
stderr_logfile=/home/wavix/.codexbot/logs/supervisor.err.log
